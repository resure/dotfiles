# ~/.config/kitty/kitty.conf
#
# Based on the macOS Terminal.app "Basic" profile, using JetBrains Mono, with a
# few personal tweaks. Colors live in light-theme.auto.conf / dark-theme.auto.conf
# and follow the macOS system appearance automatically (see the Colors note at
# the bottom). The full commented reference config is preserved in
# kitty.conf.default-backup.

#: Fonts ----------------------------------------------------------------------
# JetBrains Mono, sized a touch larger than Terminal.app's 13pt.
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        14.0

# Ligatures enabled — JetBrains Mono's programming ligatures (->, =>, !=, ...).
# Set to "always" to turn them off (matches Terminal.app, which has none).
disable_ligatures never

# Heavier strokes, closer to native macOS font smoothing. Raise toward ~0.75
# for even bolder text, lower toward 0 for thinner.
macos_thicken_font 0.3

#: Window ---------------------------------------------------------------------
# Basic profile opens at 115 columns x 32 rows.
remember_window_size  no
initial_window_width  125c
initial_window_height 40c

# No padding — herd of panes sits flush to the window edges.
window_padding_width 0

# Larger scrollback history (used when in a plain shell; herdr manages its own).
scrollback_lines 10000

#: Cursor ---------------------------------------------------------------------
# Solid block, non-blinking — and stay a block even when kitty is unfocused
# (kitty otherwise draws a hollow outline for the unfocused cursor).
cursor_shape           block
cursor_shape_unfocused block
cursor_blink_interval  0
cursor_text_color      background
# Keep shell integration, but don't let it swap the block for a beam at prompts.
shell_integration      no-cursor

#: Bell -----------------------------------------------------------------------
# No sound; flash the screen briefly instead (visual bell).
enable_audio_bell    no
visual_bell_duration 0.2

#: macOS behaviour ------------------------------------------------------------
# Basic profile has "Use Option as Meta key" enabled.
macos_option_as_alt yes

#: Remote control -------------------------------------------------------------
# Enable `kitten @` so config/palette edits can be applied to a running kitty
# without a full restart, e.g.:
#   kitten @ --to unix:/tmp/kitty load-config
#   kitten @ --to unix:/tmp/kitty set-colors -a ~/.config/kitty/light-theme.auto.conf
# Takes effect after the next kitty restart.
allow_remote_control yes
listen_on unix:/tmp/kitty

#: Colors ---------------------------------------------------------------------
# Palettes live in light-theme.auto.conf and dark-theme.auto.conf, which kitty
# applies automatically based on the macOS light/dark setting — no include line
# needed, and they override any colors set here. Edit those files to tweak the
# light and dark schemes.
